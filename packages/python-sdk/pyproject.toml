[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgoggles"
version = "0.0.0"
description = "Python SDK for pgoggles devices and simulators"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "onnxruntime>=1.17.0",
    "opencv-python>=4.9.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
export = ["ultralytics"]
tracking = ["scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
